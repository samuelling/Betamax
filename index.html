<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Betamax</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
  canvas { display: block; }
  #hud, #ovl { position: fixed; inset: 0; pointer-events: none; font-family: 'VT323', 'Courier New', monospace; color: #f4f1e8; text-shadow: 2px 2px 0 rgba(0,0,0,.55), -1px 0 0 rgba(255,40,60,.35), 1px 0 0 rgba(40,200,255,.35); letter-spacing: 1px; }
  .osd { position: absolute; font-size: clamp(26px, 4.2vw, 44px); line-height: 1; }
  #mode { top: 4.5%; left: 5%; }
  #counter { top: 4.5%; right: 5%; }
  #stamp { position: absolute; bottom: 5%; right: 5%; font-size: clamp(18px, 2.6vw, 28px); text-align: right; opacity: .9; }
  #sp { position: absolute; bottom: 5%; left: 5%; font-size: clamp(18px, 2.6vw, 28px); opacity: .9; }
  #ident { position: absolute; bottom: 12%; left: 5%; font-size: clamp(18px, 2.4vw, 26px); }
  #ident .side { display: inline-block; padding: 0 6px; margin-right: 8px; background: rgba(0,0,0,.35); }
  #ammo { position: absolute; bottom: 12%; right: 5%; font-size: clamp(26px, 3.6vw, 40px); text-align: right; }
  #ammo small { font-size: .55em; opacity: .8; }
  #hp { position: absolute; bottom: 9.5%; left: 5%; width: min(30vw, 240px); height: 8px; background: rgba(0,0,0,.4); }
  #hp i { display: block; height: 100%; width: 100%; background: #f4f1e8; }
  #lives { position: absolute; top: 11%; left: 5%; font-size: clamp(16px, 2vw, 22px); opacity: .85; }
  #cross { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
  #cross b { position: absolute; background: rgba(255,255,255,.85); box-shadow: 0 0 2px #000; }
  #hitm { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px; opacity: 0; }
  #hitm:before, #hitm:after { content: ''; position: absolute; left: 50%; top: 0; width: 2px; height: 100%; background: #fff; }
  #hitm:before { transform: rotate(45deg); } #hitm:after { transform: rotate(-45deg); }
  #feed { position: absolute; top: 12%; right: 5%; text-align: right; font-size: clamp(15px, 1.8vw, 20px); }
  #feed div { margin-bottom: 3px; transition: opacity 1s; }
  #card { position: absolute; left: 0; right: 0; top: 30%; text-align: center; font-size: clamp(34px, 7vw, 84px); opacity: 0; transition: opacity .6s; }
  #sub { position: absolute; left: 6%; right: 6%; top: 58%; text-align: center; font-size: clamp(20px, 3vw, 32px); opacity: 0; transition: opacity .8s; line-height: 1.25; }
  #sub em { font-style: normal; opacity: .8; }
  #warn { position: absolute; left: 0; right: 0; top: 22%; text-align: center; font-size: clamp(24px, 4vw, 44px); color: #ff5a4a; opacity: 0; }
  #dmg { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
  #dmg i { position: absolute; left: -60px; top: -170px; width: 120px; height: 26px; border-top: 5px solid rgba(255,40,30,.85); border-radius: 50%; transform-origin: 60px 170px; opacity: 0; transition: opacity .5s; }
  #ovl { pointer-events: auto; display: flex; align-items: center; justify-content: center; flex-direction: column; text-align: center; }
  #ovl.hidden { display: none; }
  .blue { background: #1530c8; }
  .shade { background: linear-gradient(rgba(0,0,0,.25), rgba(0,0,0,.05) 40%, rgba(0,0,0,.45)); }
  #ovl h1 { font-weight: normal; font-size: clamp(64px, 14vw, 170px); margin: 0; letter-spacing: 6px; }
  #ovl h2 { font-weight: normal; font-size: clamp(22px, 3.6vw, 38px); margin: .2em 0 1.2em; opacity: .9; }
  #ovl p { font-size: clamp(16px, 2.2vw, 24px); max-width: 760px; margin: .4em 1.5em; opacity: .9; }
  #ovl button { font-family: inherit; font-size: clamp(28px, 4.6vw, 48px); background: none; color: #f4f1e8; border: 3px solid #f4f1e8; padding: 4px 26px; margin: .8em; cursor: pointer; text-shadow: inherit; letter-spacing: 2px; }
  #ovl button:hover { background: rgba(255,255,255,.12); }
  #ovl .lives { text-align: left; font-size: clamp(16px, 2.2vw, 24px); line-height: 1.35; max-height: 46vh; overflow: auto; margin: .5em 0; }
  #ovl .lives span { opacity: .7; }
  #ovl .ttl { position: absolute; top: 4.5%; left: 5%; font-size: clamp(26px, 4.2vw, 44px); }
  #ovl .ttr { position: absolute; top: 4.5%; right: 5%; font-size: clamp(26px, 4.2vw, 44px); }
  #touch { position: fixed; inset: 0; display: none; pointer-events: auto; z-index: 2; }
  #ovl { z-index: 3; }
  #stick { position: absolute; left: 40px; bottom: 60px; width: 120px; height: 120px; border-radius: 50%; border: 2px solid rgba(255,255,255,.4); opacity: .35; }
  #knob { position: absolute; left: 35px; top: 35px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.45); }
  .tb { position: absolute; border: 2px solid rgba(255,255,255,.55); color: #fff; font: 20px 'VT323', monospace; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: rgba(0,0,0,.18); }
  .tb.on { background: rgba(255,255,255,.3); }
  :root { --u: clamp(52px, 9vmin, 84px); }
  #bFire { right: calc(var(--u)*.45); bottom: calc(var(--u)*1.0); width: calc(var(--u)*1.55); height: calc(var(--u)*1.55); font-size: 26px; }
  #bFire2 { left: calc(var(--u)*.4); top: 34%; width: var(--u); height: var(--u); opacity: .8; }
  #bAds { right: calc(var(--u)*2.25); bottom: calc(var(--u)*.45); width: var(--u); height: var(--u); }
  #bCrouch { right: calc(var(--u)*2.35); bottom: calc(var(--u)*1.7); width: calc(var(--u)*.9); height: calc(var(--u)*.9); }
  #bJump { right: calc(var(--u)*.75); bottom: calc(var(--u)*2.85); width: calc(var(--u)*.9); height: calc(var(--u)*.9); }
  #bReload { right: calc(var(--u)*1.95); bottom: calc(var(--u)*2.8); width: calc(var(--u)*.8); height: calc(var(--u)*.8); }
  #bPause { left: 50%; top: 3%; width: calc(var(--u)*.7); height: calc(var(--u)*.7); margin-left: calc(var(--u)*-.35); border-radius: 8px; }
  #ovl .row { display: flex; gap: 14px; align-items: center; justify-content: center; font-size: clamp(18px, 2.6vw, 28px); margin: .35em; }
  #ovl input[type=range] { width: min(46vw, 320px); accent-color: #f4f1e8; }
  #ovl input[type=checkbox] { width: 22px; height: 22px; accent-color: #f4f1e8; }
  #load { position: fixed; inset: 0; background: #1530c8; color: #f4f1e8; font: clamp(28px,5vw,52px) 'VT323', monospace; display: flex; align-items: center; justify-content: center; z-index: 10; }
</style>
</head>
<body>
<div id="load">LOADING TAPE...</div>
<div id="hud">
  <div class="osd" id="mode"></div>
  <div class="osd" id="counter"></div>
  <div id="lives"></div>
  <div id="sp">SP &nbsp;BETAMAX</div>
  <div id="stamp"></div>
  <div id="ident"></div>
  <div id="hp"><i></i></div>
  <div id="ammo"></div>
  <div id="cross"></div>
  <div id="hitm"></div>
  <div id="feed"></div>
  <div id="dmg"></div>
  <div id="warn">MINEFIELD &mdash; TURN BACK</div>
  <div id="card"></div>
  <div id="sub"></div>
</div>
<div id="touch"><div id="stick"><div id="knob"></div></div>
